name: Coin98
description: >-
  Coin98 is a crypto super-app built around a non-custodial, multi-chain wallet
  spanning 80+ blockchains across iOS, Android, a Chrome browser extension,
  Telegram, and web. Its product surface includes the Coin98 Super Wallet, an
  AI wallet with autonomous agents (Cypheus), the SwapX DEX aggregator routing
  across 50+ DEXs, on-chain perpetual futures (Coin98 Perps), the Fusion Visa
  debit card, PowerPool C98 staking, the Zen hardware card, Coin98 Markets data,
  and a token distribution Vault. For developers, Coin98 publishes a Developer
  Guide and the Coin98 Adapter — a React/Next.js wallet-connection SDK with
  useWallet and useWalletModal hooks and prebuilt connect UI — plus a Connect
  SDK and Telegram Mini App SDK, integrating dApps with the wallet across 40+
  chains. Surfaced originally as a multicoin-capital portfolio company and
  enriched into the API Evangelist network.
